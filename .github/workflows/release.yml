# タグ(v0.1.0 など)を push したときに、Windows のインストーラを作って GitHub の Release に添付する。
# 手元では試せていない(未確認。Docs/PROGRESS.md)。コード署名はしない(証明書が無い)。
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    env:
      ME_FAKE_CLAUDE: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 依存の導入
        run: npm ci

      - name: 型チェックと単体テスト(偽の AI)
        run: |
          npm run typecheck
          npm test

      - name: インストーラを作る
        run: npm run installer

      - name: タグと package.json の版が合っているか
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "v$v" != "${GITHUB_REF_NAME}" ]; then echo "タグ ${GITHUB_REF_NAME} と package.json の版 $v が違います"; exit 1; fi

      - name: Release に添付する
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/MarshallEducater-Setup-*.exe
            release/MarshallEducater-Setup-*.exe.blockmap
          draft: true
          generate_release_notes: true
